name: CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  CI_IMAGE: "ghcr.io/dsyorkd/ci-image/ci-go:v1.0"

jobs:
  # Main CI orchestrator - calls other modular workflows
  info:
    name: CI Info
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
      run_performance: ${{ steps.check.outputs.run_performance }}
    steps:
      - name: Check branch and determine workflow strategy
        id: check
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"

          IS_MASTER="false"
          RUN_PERFORMANCE="false"

          if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            IS_MASTER="true"
            RUN_PERFORMANCE="true"
          fi

          echo "is_master=${IS_MASTER}" >> $GITHUB_OUTPUT
          echo "run_performance=${RUN_PERFORMANCE}" >> $GITHUB_OUTPUT

          echo "## 🎯 CI Strategy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Master branch: ${IS_MASTER}" >> $GITHUB_STEP_SUMMARY
          echo "- Run performance tests: ${RUN_PERFORMANCE}" >> $GITHUB_STEP_SUMMARY

  # Call modular workflow files
  validate:
    name: Validation
    uses: ./.github/workflows/validate.yml
    needs: info

  test:
    name: Tests
    uses: ./.github/workflows/test.yml
    needs: info

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    needs: [validate, test]

  # Hardware tests - only on master or when labeled
  hardware-test:
    name: Hardware Tests
    needs: [validate, test, info]
    if: |
      (needs.info.outputs.is_master == 'true' && github.event_name == 'push') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'hw-test'))
    runs-on: [self-hosted, raspberry-pi, 5-Model-B]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            echo "Installing protobuf compiler..."
            sudo apt-get update -qq
            sudo apt-get install -y protobuf-compiler
            protoc --version
          else
            echo "protoc already installed: $(protoc --version)"
          fi

      - name: Install dependencies
        run: make deps

      - name: Build for Raspberry Pi
        run: make build-linux-arm64

      - name: Run GPIO hardware simulation tests
        run: make test-gpio
        continue-on-error: true

      - name: Test pi-controller on actual hardware
        run: |
          timeout 30s ./build/pi-controller-linux-arm64 --help &
          CONTROLLER_PID=$!
          sleep 2

          if [[ -x ./build/pi-controller-linux-arm64 ]]; then
            echo "✅ Pi Controller binary is executable on hardware"
            ./build/pi-controller-linux-arm64 version || true
            kill $CONTROLLER_PID 2>/dev/null || true
          else
            echo "❌ Pi Controller binary not executable on hardware"
            exit 1
          fi

      - name: Upload hardware test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-test-logs
          path: |
            /tmp/pi-*.log
            test/logs/
          retention-days: 3

  # CI summary and status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [info, validate, test, build, hardware-test]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Check job statuses
        run: |
          echo "## 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hardware | ${{ needs.hardware-test.result == 'success' && '✅' || (needs.hardware-test.result == 'skipped' && '⏭️' || '⚠️') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if any critical job failed
          if [[ "${{ needs.validate.result }}" == "failure" ||
                "${{ needs.test.result }}" == "failure" ||
                "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ **Critical CI jobs failed!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [[ "${{ needs.info.outputs.is_master }}" == "true" ]]; then
            echo "ℹ️ **Note**: Performance tests run separately on master branch" >> $GITHUB_STEP_SUMMARY
          fi

          echo "✅ **CI pipeline completed successfully!**" >> $GITHUB_STEP_SUMMARY
