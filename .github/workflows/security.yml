name: Security

on:
  pull_request:
    branches: [ main]
  merge_group:
    branches: [ main]

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=golang-version depName=go
  GO_VERSION: "1.25.5"  # Use Go 1.25.5 (matches go.mod toolchain)

jobs:
  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate protobuf code and download dependencies
        run: |
          make proto
          go mod download

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.17.0

      - name: Run Govulncheck
        run: govulncheck ./...

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          syft . -o spdx-json=sbom.json
          syft . -o table=sbom.txt
          echo "Generated SBOM files"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom.txt
          retention-days: 30
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.2.3"

  # Static code analysis with multiple tools
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install dependencies and build
        run: |
          make deps
          make proto
          make build

      - name: Install security analysis tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-v2
          restore-keys: |
            ${{ runner.os }}-go-v2-

      - name: Run gosec security scanner
        run: |
          # Generate SARIF for GitHub Security tab (exclude generated files)
          gosec -fmt sarif -out gosec-report.sarif -stdout -verbose=text -exclude-generated ./...
          # Generate JSON for immediate critical issue check (exclude generated files)
          gosec -fmt json -out gosec-report.json -exclude-generated ./...
          echo "Gosec scan completed"

      - name: Run staticcheck
        run: |
          staticcheck -f sarif ./... > staticcheck-report.sarif || true
          echo "Staticcheck analysis completed"

      - name: Run golangci-lint with security focus
        run: |
          golangci-lint run --out-format=sarif --output.sarif.file=golangci-report.sarif || true
          # Ensure valid SARIF file exists (create minimal valid SARIF if empty)
          if [[ ! -s golangci-report.sarif ]]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"golangci-lint","version":"1.0.0"}},"results":[]}]}' > golangci-report.sarif
          fi
          echo "Golangci-lint security scan completed"

      - name: Run custom security tests
        run: |
          make test-security-verbose

      - name: Upload gosec SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-report.sarif
          category: gosec

      - name: Upload staticcheck SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: staticcheck-report.sarif
          category: staticcheck

      - name: Upload golangci-lint SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: golangci-report.sarif
          category: golangci-lint

      - name: Check for critical security issues
        run: |
          # Parse gosec results for critical issues
          if [[ -f gosec-report.json ]]; then
            CRITICAL_COUNT=$(jq '[.Issues[] | select(.Severity == "HIGH" or .Confidence == "HIGH")] | length' gosec-report.json)
            echo "Critical security issues found: $CRITICAL_COUNT"

            if [[ $CRITICAL_COUNT -gt 0 ]]; then
              echo "❌ Critical security issues detected!"
              jq -r '.Issues[] | select(.Severity == "HIGH" or .Confidence == "HIGH") | "- \(.RuleID): \(.Details) (\(.File):\(.Line))"' gosec-report.json
              exit 1
            else
              echo "✅ No critical security issues found"
            fi
          fi

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            gosec-report.sarif
            gosec-report.json
            staticcheck-report.sarif
            golangci-report.sarif
          retention-days: 30

  # CodeQL analysis for advanced security scanning
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [ 'go' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install dependencies and build
        run: |
          make deps
          make proto
          make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Docker image security scanning
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Build test images
        run: |
          # Build images for scanning (don't push)
          docker build -f docker/Dockerfile.controller -t pi-controller:scan-test .

      - name: Scan controller image
        run: |
          # Generate SARIF for GitHub Security tab
          trivy image --format sarif --output trivy-controller.sarif pi-controller:scan-test
          # Generate JSON for immediate critical vulnerability check
          trivy image --format json --output trivy-controller.json pi-controller:scan-test
          # Show table output for workflow logs
          trivy image --format table pi-controller:scan-test

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-controller.sarif
          category: trivy-container
      - name: Check for critical vulnerabilities
        run: |
          # Check controller image
          CONTROLLER_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-controller.json)
          CONTROLLER_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-controller.json)

          echo "Controller - Critical: $CONTROLLER_CRITICAL, High: $CONTROLLER_HIGH"

          # Fail if critical vulnerabilities found
          if [[ $CONTROLLER_CRITICAL -gt 0 ]]; then
            echo "❌ Critical vulnerabilities found in container image!"
            exit 1
          else
            echo "✅ No critical vulnerabilities found in container image"
          fi

      - name: Upload container scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: |
            trivy-controller.sarif
            trivy-controller.json
          retention-days: 30

  # Secrets scanning
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for secret scanning

      - name: Run TruffleHog secrets scan
        continue-on-error: true
        run: |
          # Install TruffleHog
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.82.13

          # Scan filesystem for secrets (exclude test/example files)
          trufflehog filesystem . \
            --json \
            --no-update \
            --exclude-paths .trufflehogignore \
            > trufflehog-results.json || true

          # Check for verified secrets only
          if [[ -f trufflehog-results.json ]]; then
            VERIFIED_COUNT=$(jq '[select(.Verified == true)] | length' trufflehog-results.json)
            echo "Verified secrets found: $VERIFIED_COUNT"

            if [[ $VERIFIED_COUNT -gt 0 ]]; then
              echo "❌ Verified secrets detected!"
              jq -r 'select(.Verified == true) | "- \(.DetectorName): \(.Raw) (\(.SourceMetadata.Data.Filesystem.file):\(.SourceMetadata.Data.Filesystem.line))"' trufflehog-results.json
              exit 1
            else
              echo "✅ No verified secrets found"
            fi
          fi

      - name: Install detect-secrets
        run: |
          pip install detect-secrets

      - name: Run detect-secrets
        continue-on-error: true
        run: |
          # Create or update baseline
          if [[ -f .secrets.baseline ]]; then
            detect-secrets scan --baseline .secrets.baseline
          else
            detect-secrets scan --all-files --baseline .secrets.baseline
          fi

          # Check if any new secrets were found
          EXIT_CODE=$?
          if [[ $EXIT_CODE -eq 1 ]]; then
            echo "❌ New secrets detected by detect-secrets"
            exit 1
          else
            echo "✅ No new secrets found"
          fi

      - name: Upload secrets scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            trufflehog-results.json
            .secrets.baseline
          retention-days: 30

  # Security summary report
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, static-analysis, codeql-analysis, container-scan, secrets-scan]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check overall security status
          if [[ "${{ needs.dependency-scan.result }}" == "success" &&
                "${{ needs.static-analysis.result }}" == "success" &&
                "${{ needs.codeql-analysis.result }}" == "success" &&
                "${{ needs.container-scan.result }}" == "success" &&
                "${{ needs.secrets-scan.result }}" == "success" ]]; then
            echo "### ✅ All security scans passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Detailed reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ⚠️ Some security scans failed - please review the results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Detailed reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **WORKFLOW FAILED - Security issues must be resolved before merging**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
