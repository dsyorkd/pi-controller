name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/kubes-aura/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/kubes-aura/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/kubes-aura

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/kubes-aura/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/kubes-aura/playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: web/kubes-aura/test-results/junit.xml
          retention-days: 14

      - name: Post test summary
        if: always()
        working-directory: web/kubes-aura
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## Playwright E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/junit.xml ]; then
            TESTS=$(grep -o 'tests="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*')
            echo "- Total tests: ${TESTS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Failures: ${FAILURES:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            echo "- Status: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
