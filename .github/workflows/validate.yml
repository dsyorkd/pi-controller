name: Code Validation

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_call: # Allow this workflow to be called by others

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  GOLANGCI_LINT_VERSION: "v1.62.2"

jobs:
  validate:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install protoc
        run: |
          PROTOC_VERSION="28.3"
          curl -Lo protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q protoc.zip -d /usr/local
          sudo chmod +x /usr/local/bin/protoc
          rm protoc.zip
          protoc --version

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate protobuf code and install dependencies
        run: |
          make proto
          make deps

      - name: Format generated code
        run: |
          echo "Formatting any generated code..."
          go fmt ./proto/...

      - name: Format check
        run: |
          make fmt
          # Exclude generated protobuf files from format check
          git status --porcelain | grep -v "\.pb\.go$" > /tmp/format_changes || true
          if [[ -s /tmp/format_changes ]]; then
            echo "Code is not properly formatted. Run 'make fmt' locally."
            echo "Changed files (excluding generated .pb.go files):"
            cat /tmp/format_changes
            git diff -- ':(exclude)*.pb.go'
            exit 1
          fi
          echo "✅ All non-generated code is properly formatted"

      - name: Vet check
        run: make vet

      - name: Run golangci-lint
        run: make lint

      - name: Post status
        if: always()
        run: |
          echo "## 📋 Code Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Format check: ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Vet check: ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint check: ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
