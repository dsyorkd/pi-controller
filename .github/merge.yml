pull_request_rules:
- name: Automatically merge Renovate PRs
  conditions:
  - check-success="Build binaries (x64)"
  - check-success="Build binaries (arm64)"
  - author = renovate[bot]
  - -conflict
  actions:
    merge:
      method: rebase

- name: Automatically approve Renovate PRs
  conditions:
  - check-success="Build binaries (x64)"
  - check-success="Build binaries (arm64)"
  - author = renovate[bot]
  - -conflict
  actions:
    review:
      type: APPROVE

- name: Ask to resolve conflict
  conditions:
  - conflict
  actions:
    comment:
      message: This pull request is now in conflict. Could you fix it @{{author}}? 🙏

- name: Ask for review from code owners
  conditions:
  - check-failure="Build binaries (x64)"
  - check-failure="Build binaries (arm64)"
  - author != renovate[bot]
  actions:
    review:
      type: REQUEST_CHANGES
