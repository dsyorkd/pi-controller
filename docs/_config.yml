# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Pi Controller
email: syork@yorkserv.com
description: >- # this means to ignore newlines until "baseurl:"
  Comprehensive Kubernetes management platform for Raspberry Pi clusters.
  Automated discovery, provisioning, and GPIO-as-a-Service capabilities.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://pi-controller.io" # the base hostname & protocol for your site, e.g. http://example.com

github_username:  dsyorkd

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed

# Just the Docs specific settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Enable copy button on code
enable_copy_code_button: true

# Footer content
footer_content: "Copyright &copy; 2024 Pi Controller. Distributed under the MIT License."

# Color scheme
color_scheme: dark

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Aux links for the upper right navigation
aux_links:
  "Pi Controller on GitHub":
    - "https://github.com/dsyorkd/pi-controller"

# Makes Aux links open in a new tab
aux_links_new_tab: true


exclude:
  - "README.md"
  - "LICENSE"
  - "CONTRIBUTING.md"
  - "CODE_OF_CONDUCT.md"
  - "about.markdown"
  - "WORKFLOW_FIXES_FINAL.md"
  - "WORKFLOW_FIXES_SUMMARY.md"
  - "_archive_*"
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
