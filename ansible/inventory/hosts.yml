# Pi Controller Cluster Inventory
# ================================
# Customize this file for your cluster setup.
#
# Environment Variables Override:
#   PI_HOSTS - Comma-separated list of Pi hostnames/IPs
#   PI_SSH_USER - SSH username (default: pi)
#   PI_SSH_KEY - Path to SSH private key
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml -i inventory/production.yml

all:
  vars:
    # pi-controller version to deploy
    pi_controller_version: "latest"

    # API configuration
    api_port: 8080
    grpc_port: 9090
    websocket_port: 8081
    cluster_port: 9091

    # Cluster configuration
    bootstrap_address: 192.168.4.2

    # Data directories
    data_dir: /var/lib/pi-controller
    config_dir: /etc/pi-controller

    # Testing configuration
    test_timeout: 300  # seconds

  children:
    # All Raspberry Pi nodes
    pis:
      hosts:
        pi-node-1:
          ansible_host: 192.168.4.2
          ansible_port: 22
        pi-node-2:
          ansible_host: 192.168.4.11
          ansible_port: 22
        pi-node-3:
          ansible_host: 192.168.4.12
          ansible_port: 22
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/pi_cluster_key
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    # Bootstrap node (first node to initialize cluster)
    bootstrap:
      hosts:
        pi-node-1:
      vars:
        cluster_bootstrap: true

    # Worker nodes (join existing cluster)
    workers:
      hosts:
        pi-node-2:
        pi-node-3:
      vars:
        cluster_bootstrap: false

    # Optional: K3s-specific grouping
    k3s_servers:
      hosts:
        pi-node-1:
      vars:
        k3s_role: server

    k3s_agents:
      hosts:
        pi-node-2:
        pi-node-3:
      vars:
        k3s_role: agent
