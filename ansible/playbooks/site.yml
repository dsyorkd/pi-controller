---
# Site Playbook - Main Entry Point
# =================================
# Orchestrates the complete deployment of pi-controller.
#
# Usage:
#   # Full deployment
#   ansible-playbook playbooks/site.yml
#
#   # Only prepare nodes (no pi-controller install)
#   ansible-playbook playbooks/site.yml --tags prepare
#
#   # Only deploy pi-controller
#   ansible-playbook playbooks/site.yml --tags deploy
#
#   # Check mode (dry run)
#   ansible-playbook playbooks/site.yml --check

- name: Prepare Pi nodes
  hosts: pis
  gather_facts: true
  roles:
    - role: pi-base
      tags: [base, prepare]

- name: Deploy pi-controller to bootstrap node first
  hosts: bootstrap
  gather_facts: true
  roles:
    - role: pi-controller
      tags: [deploy, controller, bootstrap]

- name: Wait for bootstrap node to initialize
  hosts: bootstrap
  gather_facts: false
  tasks:
    - name: Wait for cluster API to be available
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/health"
        status_code: 200
      register: health
      retries: 30
      delay: 2
      until: health.status == 200
      tags: [deploy, controller]

- name: Deploy pi-controller to worker nodes
  hosts: workers
  gather_facts: true
  serial: 1  # One at a time for safe cluster join
  roles:
    - role: pi-controller
      tags: [deploy, controller, workers]

- name: Verify cluster formation
  hosts: bootstrap
  gather_facts: false
  tasks:
    - name: Check all nodes joined
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/api/v1/nodes"
        status_code: 200
      register: nodes_response
      tags: [verify]

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "Cluster nodes: {{ nodes_response.json | default('Unable to fetch') }}"
      tags: [verify]
