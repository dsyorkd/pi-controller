app:
  name: "pi-controller-test"
  environment: "development"
  data_dir: "./test-data"
  debug: false

database:
  path: "pi-controller-test.db"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"
  log_level: "warn"

api:
  host: "0.0.0.0"
  port: 9443
  read_timeout: "30s"
  write_timeout: "30s"
  cors_enabled: true
  auth_enabled: true
  tls_cert_file: "test-data/tls/server.crt"
  tls_key_file: "test-data/tls/server.key"

grpc:
  host: "0.0.0.0"
  port: 9090
  tls_cert_file: "test-data/tls/server.crt"
  tls_key_file: "test-data/tls/server.key"

log:
  level: "info"
  format: "text"

gpio:
  enabled: false
  mock_mode: true

discovery:
  enabled: false
  method: "mdns"
  interface: ""
  port: 9091
  interval: "30s"
  timeout: "5s"
  service_name: "_pi-controller._tcp"
  service_type: "_pi-controller._tcp"

  # Static nodes configuration (when method: "static")
  static_nodes: []

  # Network scan configuration (when method: "scan" or combined with mdns)
  scan_ranges: []             # Example: ["192.168.1.0/24", "10.0.0.0/16"]
  scan_ports: [9091]          # Ports to scan on each host
  scan_timeout: "2s"          # Timeout for individual port scans
  scan_concurrency: 10        # Number of concurrent scan workers
  scan_rate_limit: 100        # Maximum scans per second (prevents network flooding)

websocket:
  host: "0.0.0.0"
  port: 9081
  path: "/ws"

webui:
  enabled: false
