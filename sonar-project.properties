# =============================================================================
# SonarQube Configuration for Pi Controller
# =============================================================================
# This file configures SonarQube/SonarCloud analysis for the pi-controller project.
# Organization: yorkserv
# Project: pi-controller
# =============================================================================

# Project identification
sonar.projectKey=dsyorkd_pi-controller
sonar.organization=yorkserv

# Project metadata
sonar.projectName=Pi Controller
sonar.projectVersion=1.0.0

# =============================================================================
# Source Code Configuration
# =============================================================================
# Source directories (Go source code)
sonar.sources=cmd,internal,pkg

# Test directories
sonar.tests=test

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=go

# =============================================================================
# Coverage Configuration
# =============================================================================
# Go coverage report path (generated by 'go test -coverprofile=coverage.out')
sonar.go.coverage.reportPaths=coverage.out

# Additional coverage report paths for comprehensive analysis
# sonar.go.coverage.reportPaths=coverage.out,coverage-unit.out,coverage-integration.out,coverage-security.out

# =============================================================================
# Exclusions
# =============================================================================
# Files and directories to exclude from analysis
# Note: All exclusions must be in a single comma-separated list
sonar.exclusions=**/vendor/**,\
  **/node_modules/**,\
  **/*.pb.go,\
  **/*_grpc.pb.go,\
  **/*_test.go,\
  **/build/**,\
  **/dist/**,\
  **/web/**,\
  **/*.yaml,\
  **/*.yml,\
  **/*.json,\
  **/*.toml,\
  **/docs/**,\
  **/*.md,\
  **/scripts/**,\
  **/*.sh,\
  **/docker/**,\
  **/ansible/**,\
  **/k8s/**,\
  **/kubernetes/**,\
  **/.vscode/**,\
  **/.idea/**,\
  **/.cache/**,\
  **/.auto-claude/**,\
  **/.taskmaster/**,\
  **/data/**,\
  **/*.db,\
  **/*.sqlite,\
  **/*.sqlite3

# =============================================================================
# Test Exclusions
# =============================================================================
# Exclude non-test files from test analysis
sonar.test.exclusions=**/vendor/**,**/*.pb.go,**/*_grpc.pb.go

# =============================================================================
# Coverage Exclusions
# =============================================================================
# Files to exclude from coverage calculation
sonar.coverage.exclusions=**/*_test.go,**/*.pb.go,**/*_grpc.pb.go,**/vendor/**,**/mock_*.go,**/mocks/**,**/testdata/**

# =============================================================================
# Duplication Configuration
# =============================================================================
# Minimum lines for duplication detection
sonar.cpd.go.minimumLines=10

# Exclude generated code from duplication analysis
sonar.cpd.exclusions=**/*.pb.go,**/*_grpc.pb.go,**/vendor/**

# =============================================================================
# Analysis Parameters
# =============================================================================
# SCM provider
sonar.scm.provider=git

# Links
sonar.links.homepage=https://github.com/dsyorkd/pi-controller
sonar.links.ci=https://github.com/dsyorkd/pi-controller/actions
sonar.links.scm=https://github.com/dsyorkd/pi-controller
sonar.links.issue=https://github.com/dsyorkd/pi-controller/issues

# =============================================================================
# Quality Gate Configuration
# =============================================================================
# These thresholds align with the PRD requirements:
# - Test coverage > 80%
# - Maintainability rating A or B
# - Security rating A
# - Duplicated code < 3%
# - Zero critical/blocker issues

# Note: Quality gates are configured in SonarCloud UI, not in this file.
# This section documents the expected thresholds for reference.

# =============================================================================
# Go-Specific Configuration
# =============================================================================
# Go test arguments (if needed for custom test execution)
# sonar.go.tests.reportPaths=

# Go golint report path (optional)
# sonar.go.golint.reportPaths=

# Go govet report path (optional)
# sonar.go.govet.reportPaths=

# =============================================================================
# Additional Configuration
# =============================================================================
# Pull request decoration
# Configured via GitHub Actions and SonarCloud integration

# Branch analysis
# Main branch is 'main', develop branch is 'develop'
# Configured in SonarCloud project settings

# =============================================================================
# Notes for CI/CD Integration
# =============================================================================
# Required GitHub Secrets:
# - SONAR_TOKEN: SonarCloud authentication token (generate from SonarCloud)
# - SONAR_ORGANIZATION: yorkserv (for reference, already defined above)
#
# GitHub Actions workflow should include:
# - name: SonarCloud Scan
#   uses: SonarSource/sonarcloud-github-action@master
#   env:
#     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#
# Before scanning:
# 1. Run tests with coverage: make test-coverage
# 2. Ensure coverage.out file is generated
# 3. Run SonarCloud scan
#
# =============================================================================
