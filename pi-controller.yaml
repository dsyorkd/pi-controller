app:
  name: "pi-controller"
  environment: "development"
  data_dir: "./data"
  debug: false

database:
  path: "pi-controller.db"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"
  log_level: "warn"

api:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  tls_cert_file: ""  # Explicitly disable TLS
  tls_key_file: ""   # Explicitly disable TLS
  cors_enabled: true
  auth_enabled: true

grpc:
  host: "0.0.0.0"
  port: 9092
  tls_cert_file: ""  # Explicitly disable TLS
  tls_key_file: ""   # Explicitly disable TLS

websocket:
  host: "0.0.0.0"
  port: 8082
  path: "/ws"

log:
  level: "info"
  format: "text"

gpio:
  enabled: true
  mock_mode: true  # Use mock mode since we're not on a Raspberry Pi

discovery:
  enabled: true
  method: "mdns"
  port: 9091

auth:
  enabled: false  # Disable auth for demo
  jwt_secret: "demo-secret-do-not-use-in-production"

controller:
  server:
    http:
      port: 8080
  tls: false
