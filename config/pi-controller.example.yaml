# Pi Controller Configuration Example

app:
  name: "pi-controller"
  environment: "development"
  data_dir: "./data"
  debug: false

database:
  path: "pi-controller.db"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"
  log_level: "warn"

api:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  cors_enabled: true
  auth_enabled: false

grpc:
  host: "0.0.0.0"
  port: 9090

websocket:
  host: "0.0.0.0"
  port: 8081
  path: "/ws"

log:
  level: "info"
  format: "json"

gpio:
  enabled: true
  mock_mode: false

discovery:
  enabled: true
  method: "mdns"
  port: 9091

# Web UI server configuration
webui:
  enabled: true
  host: "0.0.0.0"
  port: 3000
  static_dir: "./web/dist"
  index_file: "index.html"
  spa_mode: true

  # Backend service URLs
  backend:
    api:
      url: "http://localhost:8080"
      internal_url: "http://pi-controller-api:8080"
      prefix: "/api"
    grpc:
      url: "localhost:9090"
      internal_url: "pi-controller-grpc:9090"
      web_enabled: false
    websocket:
      url: "ws://localhost:8081"
      internal_url: "ws://pi-controller-ws:8081"
      path: "/socket.io"
    tls:
      enabled: false

  # Runtime config injection (/config.js endpoint)
  runtime_config:
    enabled: true
    path: "/config.js"

  # Authentication
  auth:
    enabled: true
    session_secret_env: "WEBUI_SESSION_SECRET"
    jwt_secret_env: "WEBUI_JWT_SECRET"
    session_timeout: "24h"
    cookie_secure: false  # Set to true in production with HTTPS
    cookie_same_site: "strict"

  # CORS settings
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-Requested-With"]
    expose_headers: ["X-Total-Count", "X-Page"]
    credentials: true
    max_age: "12h"

  # Feature flags (exposed to frontend)
  features:
    gpio_control: true
    cluster_management: true
    certificate_management: true
    real_time_metrics: true
    node_discovery: true
    advanced_networking: false
    experimental: false

  # UI customization
  branding:
    title: "Pi Controller"
    logo_url: ""
    favicon_url: ""
    primary_color: "#10b981"
    theme: "dark"  # dark, light, auto

  # Performance & caching
  cache:
    enabled: true
    static_max_age: "31536000"  # 1 year for immutable assets
    html_max_age: "0"
    api_cache_max_age: "300"  # 5 minutes

  # Compression
  compression:
    enabled: true
    level: 6
    min_size: 1024

  # Security headers
  security:
    hsts_enabled: false  # Enable in production with HTTPS
    hsts_max_age: "31536000"
    frame_deny: true
    content_type_nosniff: true
    xss_protection: true
    csp_enabled: false
    csp_directives: ""

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst_size: 100

  # Observability
  observability:
    access_log: true
    access_log_format: "json"
    metrics_enabled: true
    metrics_path: "/metrics"
    tracing_enabled: false

  # Resource limits (for K8s)
  resources:
    cpu_limit: "500m"
    memory_limit: "512Mi"
    cpu_request: "100m"
    memory_request: "128Mi"

  # Health checks
  health:
    enabled: true
    path: "/health"
    liveness_path: "/health/live"
    readiness_path: "/health/ready"
