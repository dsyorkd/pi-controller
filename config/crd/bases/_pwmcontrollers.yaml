                  required:
                  - channel
                  - dutyCycle
                  - enabled
                  type: object
                type: array
              externalClock:
                description: ExternalClock uses external clock source if true
                type: boolean
              invertOutput:
                description: InvertOutput inverts all PWM outputs if true
                type: boolean
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector specifies which node this PWM controller
                  should be managed on
                type: object
              outputEnable:
