        description: PWMController is the Schema for the pwmcontrollers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PWMControllerSpec defines the desired state of PWMController
            properties:
              address:
                description: Address is the I2C address of the PWM controller (e.g.,
                  0x40)
                type: integer
              baseFrequency:
                description: BaseFrequency sets the base PWM frequency in Hz for all
                  channels
                type: integer
              channelCount:
                description: ChannelCount is the number of PWM channels supported
